openapi: 3.1.0
info:
  title: AquaVerse AI
  description: 'Predictive analytics platform for fish/shrimp aquaculture in Tamil
    Nadu. Two-layer architecture: quantitative core (LightGBM/EBM + temporal models)
    and reasoning layer (Qwen3-8B + LoRA adapters via vLLM). All numbers originate
    from the quantitative layer; the reasoning layer is architecturally forbidden
    from emitting any numeral it did not receive.'
  contact:
    name: AquaVerse AI Engineering
    email: engineering@aquaverse.example.com
  license:
    name: Proprietary
  version: 0.1.0
paths:
  /v1/auth/otp/request:
    post:
      tags:
      - Auth
      summary: Request an OTP for farmer login/registration
      description: Sends a 6-digit OTP to the farmer's registered phone number via
        SMS. Rate-limited to 5 requests/minute per phone number.
      operationId: otp_request_v1_auth_otp_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/otp/verify:
    post:
      tags:
      - Auth
      summary: Verify OTP and receive a JWT
      description: 'Phase 1: return fixture JWT.

        Phase 3: verify HMAC hash from Redis, issue pond-scoped JWT.'
      operationId: otp_verify_v1_auth_otp_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/token:
    post:
      tags:
      - Auth
      summary: Staff/admin token via Keycloak credentials or code exchange
      description: 'Phase 1: return fixture token.

        Phase 3: verify against Keycloak, embed district claims.'
      operationId: token_v1_auth_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/logs:
    post:
      tags:
      - Ingest
      summary: Submit a water quality log entry
      description: Submit a water quality measurement for a pond. Accepts a `client_log_id`
        for idempotency — replays return `200` with the original record.
      operationId: create_log_v1_logs_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Ingest
      summary: List water quality logs
      description: 'Phase 1: return empty cursor page fixture.'
      operationId: list_logs_v1_logs_get
      parameters:
      - name: pond_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Pond Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_LogOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/media/upload-url:
    post:
      tags:
      - Ingest
      summary: Request a presigned upload URL
      description: Returns a presigned S3/R2 PUT URL. The client uploads directly
        to object storage, then calls POST /v1/media/{media_id}/commit to finalise.
      operationId: media_upload_url_v1_media_upload_url_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadUrlIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadUrlOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/media/{media_id}/commit:
    post:
      tags:
      - Ingest
      summary: Commit an uploaded media file
      description: Mark an upload as committed after the client has PUT the file to
        the presigned URL.
      operationId: media_commit_v1_media__media_id__commit_post
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Media Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCommitIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds:
    get:
      tags:
      - Ponds & ML
      summary: List accessible ponds
      operationId: list_ponds_v1_ponds_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_PondOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds/{pond_id}:
    get:
      tags:
      - Ponds & ML
      summary: Get pond details
      operationId: get_pond_v1_ponds__pond_id__get
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PondOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds/{pond_id}/timeseries:
    get:
      tags:
      - Ponds & ML
      summary: Get time-series data for a pond parameter
      description: Returns hourly aggregated time-series for a single water quality
        parameter. 12-month, 6-parameter hourly queries must return in <300ms p95.
      operationId: get_pond_timeseries_v1_ponds__pond_id__timeseries_get
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      - name: parameter
        in: query
        required: false
        schema:
          type: string
          default: dissolved_oxygen_mgl
          title: Parameter
      - name: from_ts
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From Ts
      - name: to_ts
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To Ts
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PondTimeseriesOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds/{pond_id}/events:
    get:
      tags:
      - Ponds & ML
      summary: Get event timeline for a pond
      operationId: get_pond_events_v1_ponds__pond_id__events_get
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_PondEventOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds/{pond_id}/risk:
    get:
      tags:
      - Ponds & ML
      summary: Get current risk score for a pond
      description: Returns a composite risk score (0–1) produced by the LightGBM/EBM
        quantitative layer, with per-feature SHAP attributions. Suppression state
        is always visible.
      operationId: get_pond_risk_v1_ponds__pond_id__risk_get
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/risk/worklist:
    get:
      tags:
      - Ponds & ML
      summary: Risk worklist for staff — all ponds ranked by risk
      operationId: get_risk_worklist_v1_risk_worklist_get
      parameters:
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: District
      - name: risk_level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Level
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_WorklistItem_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds/{pond_id}/forecast/do:
    get:
      tags:
      - Ponds & ML
      summary: Dissolved oxygen forecast with uncertainty bands
      description: 'Returns a 24-hour dissolved oxygen forecast with 10th/50th/90th
        percentile bands from the temporal model (TCN/TFT/PatchTST). RULE: Bare point
        estimates are forbidden — bands are always returned.'
      operationId: get_do_forecast_v1_ponds__pond_id__forecast_do_get
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      - name: horizon_hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 168
          minimum: 1
          default: 24
          title: Horizon Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/models:
    get:
      tags:
      - Ponds & ML
      - Models
      summary: List registered ML models
      operationId: list_models_v1_models_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_ModelOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/models/metrics:
    get:
      tags:
      - Ponds & ML
      - Models
      summary: Operational metrics for the model serving layer
      description: Exposes `rejected_attempts` — the count of LLM responses that were
        rejected because they contained a numeral not present in the quantitative
        tool-call payload. This MUST read 0 in steady state.
      operationId: get_model_metrics_v1_models_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelMetricsOut'
  /v1/models/drift:
    get:
      tags:
      - Ponds & ML
      - Models
      summary: Model drift reports
      operationId: get_model_drift_v1_models_drift_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_DriftReport_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/data-quality:
    get:
      tags:
      - Ponds & ML
      - Data Quality
      summary: Data quality signals across all ponds
      operationId: get_data_quality_v1_data_quality_get
      parameters:
      - name: pond_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Pond Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataQualityOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/alerts:
    get:
      tags:
      - Alerts
      summary: List alerts
      description: Returns alerts with their suppression state always visible. If
        suppressed=True, suppression_reason explains why (e.g. 'Sensor offline > 4h').
      operationId: list_alerts_v1_alerts_get
      parameters:
      - name: pond_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Pond Id
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
      - name: acked
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Acked
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_AlertOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/alerts/{alert_id}/ack:
    post:
      tags:
      - Alerts
      summary: Acknowledge an alert
      operationId: ack_alert_v1_alerts__alert_id__ack_post
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Alert Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAckIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAckOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/alerts/{alert_id}/feedback:
    post:
      tags:
      - Alerts
      summary: Submit feedback on an alert
      operationId: alert_feedback_v1_alerts__alert_id__feedback_post
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Alert Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertFeedbackIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertFeedbackOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reason:
    post:
      tags:
      - Advisory
      summary: '[INTERNAL] Generate a reasoned advisory from the LLM layer'
      description: Internal-only endpoint (requires X-Internal-Token header). The
        LLM output is validated by number_validator.py before being returned. Any
        numeral in the LLM response that was not present in the tool_call_payload
        causes rejection and regeneration (server-side, in the request path).
      operationId: reason_v1_reason_post
      parameters:
      - name: X-Internal-Token
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Internal-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasonOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ask:
    post:
      tags:
      - Advisory
      summary: Ask a question about your pond (farmer-facing)
      description: 'Farmer-facing conversational Q&A. Routes through the full two-layer
        pipeline: quantitative scores are fetched first, then the reasoning layer
        generates an explanation using only those numbers. Rate-limited to 30 requests/minute.'
      operationId: ask_v1_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/advisories:
    get:
      tags:
      - Advisory
      summary: List published advisories
      operationId: list_advisories_v1_advisories_get
      parameters:
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: District
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_AdvisoryOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/advisories/broadcast:
    post:
      tags:
      - Advisory
      summary: Broadcast an advisory to farmers (staff only)
      operationId: broadcast_advisory_v1_advisories_broadcast_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisoryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/twin/{pond_id}/state:
    get:
      tags:
      - Digital Twin
      summary: Get the current digital twin state for a pond
      description: 'Returns the current state vector. RULE: The response is identical
        whether backed by real sensors or the simulator. The source is never revealed
        in the response schema.'
      operationId: get_twin_state_v1_twin__pond_id__state_get
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateVector'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/twin/{pond_id}/whatif:
    post:
      tags:
      - Digital Twin
      summary: Run a what-if simulation
      description: Applies the given scenario deltas to the current twin state and
        returns the simulated outcome. Risk delta indicates how much the risk score
        would change.
      operationId: whatif_v1_twin__pond_id__whatif_post
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatIfScenario'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatIfOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/geo/ponds:
    get:
      tags:
      - Geo
      summary: GeoJSON FeatureCollection of all accessible ponds
      description: Returns a GeoJSON FeatureCollection. Properties include risk_score
        and suppressed flag. Spatial queries use PostGIS — 'ponds within 2km of shared
        water source' returns in <200ms.
      operationId: geo_ponds_v1_geo_ponds_get
      parameters:
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: District
      - name: risk_level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Level
      - name: within_km
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Filter ponds within this many km of a given point (requires
            lat/lon params)
          title: Within Km
        description: Filter ponds within this many km of a given point (requires lat/lon
          params)
      - name: lat
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 90
            minimum: -90
          - type: 'null'
          title: Lat
      - name: lon
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 180
            minimum: -180
          - type: 'null'
          title: Lon
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Geo Ponds V1 Geo Ponds Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/geo/clusters:
    get:
      tags:
      - Geo
      summary: Space-time outbreak clusters
      description: Returns detected outbreak clusters using a space-time scan statistic.
        Each cluster includes the bounding polygon and affected pond IDs.
      operationId: geo_clusters_v1_geo_clusters_get
      parameters:
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: District
      - name: days_back
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days Back
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Geo Clusters V1 Geo Clusters Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/translate:
    post:
      tags:
      - i18n
      summary: Translate text using IndicTrans2 / Bhashini
      description: Translate text between Indian languages using IndicTrans2 (via
        Bhashini API). Results are cached in Redis by hash of (source_lang, target_lang,
        text) with ~90% hit rate target.
      operationId: translate_v1_translate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslateOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reports/export:
    get:
      tags:
      - Reports
      summary: Export pond data as PDF or XLSX
      description: Triggers an async export job. Returns a job_id and a download_url
        once the export is ready (polled by the client or delivered via SSE).
      operationId: export_report_v1_reports_export_get
      parameters:
      - name: pond_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Pond Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          description: pdf | xlsx
          default: pdf
          title: Format
        description: pdf | xlsx
      - name: from_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD
          title: From Date
        description: YYYY-MM-DD
      - name: to_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD
          title: To Date
        description: YYYY-MM-DD
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
