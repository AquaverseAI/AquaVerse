          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Geo Clusters V1 Geo Clusters Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
