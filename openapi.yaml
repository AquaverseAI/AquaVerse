openapi: 3.1.0
info:
  title: AquaVerse AI
  description: 'Predictive analytics platform for fish/shrimp aquaculture in Tamil
    Nadu. Two-layer architecture: quantitative core (LightGBM/EBM + temporal models)
    and reasoning layer (Qwen3-8B + LoRA adapters via vLLM). All numbers originate
    from the quantitative layer; the reasoning layer is architecturally forbidden
    from emitting any numeral it did not receive.'
  contact:
    name: AquaVerse AI Engineering
    email: engineering@aquaverse.example.com
  license:
    name: Proprietary
  version: 0.1.0
paths:
  /v1/auth/otp/request:
    post:
      tags:
      - Auth
      summary: Request an OTP for farmer / staff login
      description: Sends a 6-digit OTP to the farmer's registered phone number. In
        development mode the OTP is returned in the response as `dev_otp`. Rate-limited
        to 5 requests/minute per phone number.
      operationId: otp_request_v1_auth_otp_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/otp/verify:
    post:
      tags:
      - Auth
      summary: Verify OTP and receive a JWT
      operationId: otp_verify_v1_auth_otp_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/token:
    post:
      tags:
      - Auth
      summary: Staff/admin login via username + password
      description: Password-based login for staff and admin accounts. Farmers should
        use the OTP flow instead.
      operationId: token_v1_auth_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/me:
    get:
      tags:
      - Auth
      summary: Return the current user's identity from the JWT
      operationId: me_v1_auth_me_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/logs:
    post:
      tags:
      - Ingest
      summary: Submit a water quality log entry
      description: "Submit a water quality measurement for a pond. Accepts a `client_log_id`\
        \ for idempotency \u2014 replays return `200` with the original record."
      operationId: create_log_v1_logs_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Ingest
      summary: List water quality logs
      description: Keyset-paginated on `(recorded_at, id)` DESC. Pass the previous
        page's `next_cursor` back as `cursor` to fetch the next page; a `null` `next_cursor`
        means there is no further page.
      operationId: list_logs_v1_logs_get
      parameters:
      - name: pond_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Pond Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_LogOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/media/upload-url:
    post:
      tags:
      - Ingest
      summary: Request a presigned upload URL
      description: Returns a presigned S3/R2 PUT URL. The client uploads directly
        to object storage, then calls POST /v1/media/{media_id}/commit to finalise.
      operationId: media_upload_url_v1_media_upload_url_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadUrlIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadUrlOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/media/{media_id}/commit:
    post:
      tags:
      - Ingest
      summary: Commit an uploaded media file
      description: "Mark an upload as committed after the client has PUT the file\
        \ to the presigned URL. HEADs the real object in S3/MinIO first \u2014 never\
        \ marks `committed` without confirming the object actually exists. Returns\
        \ 409 if it can't be found or the store is unreachable."
      operationId: media_commit_v1_media__media_id__commit_post
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Media Id
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCommitIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ingest/sensor/{pond_id}:
    post:
      tags:
      - Ingest
      summary: Push a reading from a pond's IoT sensor unit
      description: "Webhook for pond-side sensor hardware \u2014 accepts the device's\
        \ raw JSON shape (`ph`, `air_temperature`, `humidity`, `water_temperature`,\
        \ `turbidity`) directly, no farmer/staff login required. Persisted as a `Log`\
        \ row with `source=\"sensor\"`, timestamped at server receipt time, and immediately\
        \ visible via GET /v1/logs and GET /v1/ponds/{pond_id}/timeseries. Optionally\
        \ gated by a shared `X-Device-Key` header \u2014 see app/config.py."
      operationId: ingest_sensor_reading_v1_ingest_sensor__pond_id__post
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      - name: x-device-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Device-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorIngestIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorIngestOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds:
    get:
      tags:
      - Ponds & ML
      summary: List accessible ponds
      description: "Real keyset pagination \u2014 sorted by created_at DESC, id DESC.\n\
        \nScoping:\n  * admin \u2014 unrestricted, or filtered to `district` if given.\n\
        \  * staff \u2014 filtered to `district` (validated via rbac.require_district)\n\
        \    if given, else defaulted to the caller's own district claim; a\n    staff\
        \ token with no district claim gets an empty page (fail closed).\n  * farmer\
        \ \u2014 always scoped to ponds they own; `district` is ignored."
      operationId: list_ponds_v1_ponds_get
      parameters:
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: District
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_PondOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds/{pond_id}:
    get:
      tags:
      - Ponds & ML
      summary: Get pond details
      operationId: get_pond_v1_ponds__pond_id__get
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PondOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds/{pond_id}/timeseries:
    get:
      tags:
      - Ponds & ML
      summary: Get time-series data for a pond parameter
      description: Returns hourly aggregated time-series for a single water quality
        parameter. 12-month, 6-parameter hourly queries must return in <300ms p95.
      operationId: get_pond_timeseries_v1_ponds__pond_id__timeseries_get
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      - name: parameter
        in: query
        required: false
        schema:
          type: string
          default: dissolved_oxygen_mgl
          title: Parameter
      - name: from_ts
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From Ts
      - name: to_ts
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To Ts
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PondTimeseriesOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds/{pond_id}/events:
    get:
      tags:
      - Ponds & ML
      summary: Get event timeline for a pond
      description: "Synthesizes events from real Log rows.\n\nThere is no dedicated\
        \ events table. `Alert` (app/db/models/alert.py) is a\nreal table but nothing\
        \ populates it yet \u2014 raising real alerts is P2.1's\njob. The alert-sourced\
        \ half of this endpoint's `event_type` space is\nintentionally deferred, not\
        \ forgotten; today every event is\n`event_type=\"log\"`."
      operationId: get_pond_events_v1_ponds__pond_id__events_get
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_PondEventOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds/{pond_id}/risk:
    get:
      tags:
      - Ponds & ML
      summary: Get current risk score for a pond
      description: "Returns a composite risk score (0\u20131) from the real M2 LightGBM\
        \ mortality-risk booster, with real per-feature SHAP attributions. This model\
        \ predicts environmental-stress-driven mortality risk only \u2014 NOT a disease/pathogen\
        \ classifier (see app/ml_inference/numeric/m2_risk_engine.py module docstring).\
        \ Suppression state is always visible."
      operationId: get_pond_risk_v1_ponds__pond_id__risk_get
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/risk/worklist:
    get:
      tags:
      - Ponds & ML
      summary: "Risk worklist for staff \u2014 all ponds ranked by risk"
      description: "Ranks every pond visible to the caller by the real M2 risk score,\
        \ descending. Computed live, in-process, per request \u2014 fine at current\
        \ demo scale, but does NOT scale to a large ward/district: a real deployment\
        \ would need to pre-compute/cache these scores (e.g. a periodic job writing\
        \ to a risk-scores table) rather than scoring every pond synchronously inside\
        \ the request. Because ranking is computed fresh per request rather than sourced\
        \ from a stable DB sort key, this endpoint uses a simple offset-encoded cursor\
        \ (core.pagination.encode_cursor/decode_cursor) instead of the keyset-pagination\
        \ convention used elsewhere in this module \u2014 keyset pagination requires\
        \ a stable persisted ordering to page against, which an in-request live ranking\
        \ doesn't have."
      operationId: get_risk_worklist_v1_risk_worklist_get
      parameters:
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: District
      - name: risk_level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Level
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_WorklistItem_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds/{pond_id}/forecast/do:
    get:
      tags:
      - Ponds & ML
      summary: Dissolved oxygen forecast with uncertainty bands
      description: "Returns a dissolved oxygen forecast (default 24h, up to 168h)\
        \ with 10th/50th/90th percentile bands computed from this pond's own real\
        \ historical DO readings, bucketed by hour-of-day. This is an honest empirical\
        \ seasonal-naive baseline, NOT a trained temporal model \u2014 no TCN/TFT/PatchTST\
        \ exists anywhere in this repo (see app/ml_inference/numeric/do_forecast.py\
        \ module docstring). RULE: Bare point estimates are forbidden \u2014 bands\
        \ are always returned."
      operationId: get_do_forecast_v1_ponds__pond_id__forecast_do_get
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      - name: horizon_hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 168
          minimum: 1
          default: 24
          title: Horizon Hours
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/models:
    get:
      tags:
      - Ponds & ML
      - Models
      summary: List registered ML models
      description: "Real keyset pagination over `model_registry`, same shape as\n\
        `list_ponds`. `ensure_active_model_registered` keeps that table\nsynced to\
        \ whatever M2 bundle is actually loaded before every read \u2014\nsee app/ml_inference/model_registry_sync.py\
        \ for why this can't just\nbe a one-time seed."
      operationId: list_models_v1_models_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_ModelOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/models/metrics:
    get:
      tags:
      - Ponds & ML
      - Models
      summary: Operational metrics for the model serving layer
      description: "Exposes `rejected_attempts` \u2014 the count of LLM responses\
        \ that were rejected because they contained a numeral not present in the quantitative\
        \ tool-call payload. This MUST read 0 in steady state."
      operationId: get_model_metrics_v1_models_metrics_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelMetricsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/models/drift:
    get:
      tags:
      - Ponds & ML
      - Models
      summary: Model drift reports
      description: "Real PSI-based drift signal for the one actively-served model\
        \ \u2014 see\napp/ml_inference/drift.py for what this does and doesn't measure.\n\
        `cursor`/`limit` are accepted for response-shape compatibility; there\nis\
        \ exactly one active model to report on, so this never actually\npaginates."
      operationId: get_model_drift_v1_models_drift_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage_DriftReport_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/data-quality:
    get:
      tags:
      - Ponds & ML
      - Data Quality
      summary: Data quality signals across all ponds
      description: "Real signals over real `Log` rows from the last 7 days, scoped\
        \ the\nsame way GET /v1/ponds is: a specific `pond_id` if given, else a\n\
        staff caller's own district (fail closed if their token has none),\nelse \u2014\
        \ for admin \u2014 every pond.\n\n`sensor_offline_ponds` reuses `_STALE_LOG_THRESHOLD_HOURS`,\
        \ the exact\nthreshold Alerts' blind-state suppression already uses (see that\n\
        constant's docstring) \u2014 one \"how old is too old\" answer per\ncodebase,\
        \ not a second invented number."
      operationId: get_data_quality_v1_data_quality_get
      parameters:
      - name: pond_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Pond Id
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataQualityOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ponds/{pond_id}/multimodal_risk:
    post:
      tags:
      - Ponds & ML
      summary: Compute multimodal risk score using PyTorch Fusion (M2)
      description: Fuses Tabular Sensor Data with Image Concept Bottleneck outputs.
      operationId: compute_multimodal_risk_v1_ponds__pond_id__multimodal_risk_post
      parameters:
      - name: pond_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pond Id
      - name: image_age_hours
        in: query
        required: false
        schema:
          type: number
          default: 0.0
          title: Image Age Hours
      - name: authorization
        in: header
        required: false
        schema:
