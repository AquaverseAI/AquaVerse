version: '3.8'

services:
  # 1. Reverse Proxy & TLS Termination
  caddy:
    image: caddy:2-alpine
    container_name: aquaverse-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv/dist:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fastapi-backend

  # 2. FastAPI Async Uvicorn Backend
  fastapi-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aquaverse-fastapi
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://aquaverse:aquapass123@postgres-timescale:5432/aquaversedb
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - VLLM_HOST=vllm-engine:8000
    depends_on:
      - postgres-timescale
      - redis
      - minio

  # 3. PostgreSQL 16 + TimescaleDB + PostGIS (Single Database)
  postgres-timescale:
    image: timescale/timescaledb-ha:pg16
    container_name: aquaverse-postgres-timescale
    restart: unless-stopped
    environment:
      - POSTGRES_DB=aquaversedb
      - POSTGRES_USER=aquaverse
      - POSTGRES_PASSWORD=aquapass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 4. Redis (Cache + ARQ Broker + Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: aquaverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 5. MinIO / R2 (Object Storage for Images & Microscopic Slides)
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: aquaverse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 6. vLLM Engine (Qwen3-8B + 3 LoRA Adapters: m1_chemistry, m2_health, m3_production)
  vllm-engine:
    image: vllm/vllm-openai:v0.4.2
    container_name: aquaverse-vllm
    restart: unless-stopped
    environment:
      - MODEL_NAME=Qwen/Qwen2.5-7B-Instruct
      - LORA_ADAPTER_M1=adapters/m1_chemistry
      - LORA_ADAPTER_M2=adapters/m2_health
      - LORA_ADAPTER_M3=adapters/m3_production
    ports:
      - "8001:8000"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  minio_data:
