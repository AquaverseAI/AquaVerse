      summary: GeoJSON FeatureCollection of all accessible ponds
      description: "Returns a GeoJSON FeatureCollection. Properties include risk_score\
        \ and suppressed flag. Ponds with no recorded location (Pond.geom) are omitted\
        \ \u2014 never plotted with a fabricated coordinate. Spatial queries use real\
        \ PostGIS ST_DWithin (geography cast, so within_km is an accurate great-circle\
        \ distance, not a planar approximation)."
      operationId: geo_ponds_v1_geo_ponds_get
      parameters:
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: District
      - name: risk_level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Level
      - name: within_km
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Filter ponds within this many km of a given point (requires
            lat/lon params)
          title: Within Km
        description: Filter ponds within this many km of a given point (requires lat/lon
          params)
      - name: lat
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 90
            minimum: -90
          - type: 'null'
          title: Lat
      - name: lon
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 180
            minimum: -180
          - type: 'null'
          title: Lon
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Geo Ponds V1 Geo Ponds Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/geo/clusters:
    get:
      tags:
      - Geo
      summary: Spatial outbreak clusters
      description: "Detects spatial clusters of ponds with a recent alert using DBSCAN\
        \ (real, standard density-based clustering \u2014 see app/geo/clustering.py's\
        \ module docstring for why this is not literally the space-time scan statistic\
        \ (SaTScan) the original spec named, and why no p_value is returned). Each\
        \ cluster includes an approximate circular bounding polygon and the affected\
        \ pond IDs."
