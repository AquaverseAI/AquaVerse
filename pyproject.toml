[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


[project]
name = "aquaverse-backend"
version = "0.1.0"
description = "AquaVerse AI — predictive analytics backend for aquaculture in Tamil Nadu"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",
    # Cache / broker
    "redis[hiredis]>=5.0.0",
    "arq>=0.25.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    # Observability
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "sentry-sdk[fastapi]>=2.7.0",
    # Object storage
    "boto3>=1.34.0",         # MinIO / R2 compatible
    # ML / numeric
    "lightgbm>=4.3.0",
    "interpret>=0.6.0",      # EBM
    "shap>=0.45.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.13.0",
    # i18n / TTS
    "langdetect>=1.0.9",
    # Reporting
    "reportlab>=4.2.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
    # Geo / clustering
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "orjson>=3.10.0",
    "tenacity>=8.3.0",
    "anyio>=4.4.0",
    "starlette-exporter>=0.22.0",
    "sse-starlette>=2.1.0",
    "llvmlite>=0.41.0",
    "numba>=0.59.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    "schemathesis>=3.35.0",
    "testcontainers[postgres,redis]>=4.7.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    # type stubs
    "types-pytz>=2024.1.0",
    "types-python-dateutil>=2.9.0",
    "types-redis>=4.6.0",
    "boto3-stubs[s3]>=1.34.0",
    "pandas-stubs>=2.2.0",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
    "ANN",      # flake8-annotations (enforce typing)
    "S",        # flake8-bandit (security)
    "PT",       # flake8-pytest-style
]
ignore = [
    "S101",     # assert allowed in tests
    "B008",     # do not perform function calls in default args (FastAPI Depends)
    "E501",     # line too long
    "S104",     # bind to all interfaces
    "S105",     # hardcoded password/token key
    "S106",     # hardcoded password/token value
    "RUF001",   # ambiguous characters (en-dash in descriptions)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"scripts/**" = ["ANN", "S"]
"alembic/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "scripts/", "tests/"]

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "interpret.*",
    "shap.*",
    "mlflow.*",
    "langdetect.*",
    "reportlab.*",
    "shapely.*",
    "pyproj.*",
    "testcontainers.*",
    "schemathesis.*",
    "arq.*",
    "geoalchemy2.*",
    "jose.*",
    "passlib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "integration: integration tests requiring real containers",
    "contract: schemathesis contract tests",
    "unit: pure unit tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["app/db/models/*", "alembic/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
