name: aquaverse_farmer_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^3.5.1
  path_provider: ^2.1.4
  path: ^1.9.0
  dio: ^5.7.0
  retrofit: ^4.4.1
  freezed_annotation: any
  json_annotation: ^4.9.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  video_player: ^2.9.1
  flutter_map: ^7.0.2
  fl_chart: ^0.69.0
  just_audio: ^0.9.40
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: any
  drift_dev: any
  freezed: any
  json_serializable: any
  retrofit_generator: any
  flutter_lints: any
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:

  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/splash/

