components:
  schemas:
    AdvisoryOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
        language:
          type: string
          title: Language
        target_district:
          anyOf:
          - type: string
          - type: 'null'
          title: Target District
        target_species:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Species
        severity:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
        issued_at:
          type: string
          format: date-time
          title: Issued At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      type: object
      required:
      - id
      - title
      - body
      - language
      - issued_at
      title: AdvisoryOut
    AlertAckIn:
      properties:
        note:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Note
        client_log_id:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Client Log Id
      type: object
      title: AlertAckIn
    AlertAckOut:
      properties:
        alert_id:
          type: string
          format: uuid
          title: Alert Id
        acked:
          type: boolean
          title: Acked
        acked_at:
          type: string
          format: date-time
          title: Acked At
        message:
          type: string
          title: Message
      type: object
      required:
      - alert_id
      - acked
      - acked_at
      - message
      title: AlertAckOut
    AlertFeedbackIn:
      properties:
        useful:
          type: boolean
          title: Useful
        comment:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Comment
        false_positive:
          type: boolean
          title: False Positive
          default: false
      type: object
      required:
      - useful
      title: AlertFeedbackIn
    AlertFeedbackOut:
      properties:
        alert_id:
          type: string
          format: uuid
          title: Alert Id
        feedback_recorded:
          type: boolean
          title: Feedback Recorded
        message:
          type: string
          title: Message
      type: object
      required:
      - alert_id
      - feedback_recorded
      - message
      title: AlertFeedbackOut
    AlertOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        pond_id:
          type: string
          format: uuid
          title: Pond Id
        pond_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Pond Name
        alert_type:
          type: string
          title: Alert Type
        severity:
          type: string
          title: Severity
        title:
          type: string
          title: Title
        message:
          type: string
          title: Message
        parameter:
          anyOf:
          - type: string
          - type: 'null'
          title: Parameter
        measured_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Measured Value
        threshold_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Threshold Value
        suppressed:
          type: boolean
          title: Suppressed
          description: "True if this alert is suppressed due to blind state (e.g.\
            \ sensor offline). Always surfaced \u2014 never hidden from the client."
        suppression_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Suppression Reason
          description: Why the alert is suppressed. Always provided when suppressed=True.
        acked:
          type: boolean
          title: Acked
        acked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Acked At
        risk_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Risk Score
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - pond_id
      - alert_type
      - severity
      - title
      - message
      - suppressed
      - acked
      - created_at
      title: AlertOut
    AskIn:
      properties:
        pond_id:
          type: string
          format: uuid
          title: Pond Id
        question:
          type: string
          maxLength: 1000
          title: Question
        language:
          type: string
          title: Language
          description: BCP-47 language code
          default: ta
        include_tts:
          type: boolean
          title: Include Tts
          description: Return TTS audio URL in response
          default: false
      type: object
      required:
      - pond_id
      - question
      title: AskIn
    AskOut:
      properties:
        pond_id:
          type: string
          format: uuid
          title: Pond Id
        question:
          type: string
          title: Question
        answer:
          type: string
          title: Answer
        language:
          type: string
          title: Language
        tts_url:
          anyOf:
