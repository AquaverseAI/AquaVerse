name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/aquaverse_test"
  APP_SECRET_KEY: "ci_secret_key_minimum_32_characters_here"
  INTERNAL_API_TOKEN: "ci_internal_token_minimum_32_chars_here"

jobs:
  # ---------------------------------------------------------------------------
  # Lint and type check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check app/ tests/ scripts/

      - name: MyPy type check
        run: mypy --strict app/
        continue-on-error: false  # strict typing is required

  # ---------------------------------------------------------------------------
  # Unit tests (no containers needed)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: >-
          pytest tests/unit/ -m unit -v
          --cov=app.advisory.number_validator
          --cov=app.core.pagination
          --cov=app.ml_inference.numeric.m3_engine
          --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Integration tests (with testcontainers)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=120

  # ---------------------------------------------------------------------------
  # Contract tests (schemathesis against openapi.yaml)
  # ---------------------------------------------------------------------------
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate openapi.yaml
        run: |
          python -c "
          import os, json, yaml
          os.environ['DATABASE_URL'] = 'postgresql+asyncpg://x:x@localhost/x'
          os.environ['APP_SECRET_KEY'] = 'ci_secret_key_minimum_32_characters_here'
          os.environ['INTERNAL_API_TOKEN'] = 'ci_internal_token_minimum_32_chars_here'
          from app.main import app
          spec = app.openapi()
          with open('openapi.yaml', 'w') as f:
              yaml.dump(spec, f, default_flow_style=False, allow_unicode=True)
          print(f'Generated openapi.yaml with {len(spec[\"paths\"])} paths')
          "

      - name: Run contract tests
        run: pytest tests/contract/ -m contract -v

      - name: OpenAPI diff check (fail on breaking changes)
        run: |
          git diff --name-only HEAD || true
          if git show HEAD:openapi.yaml > /tmp/prev_openapi.yaml 2>/dev/null; then
            pip install openapi-diff 2>/dev/null || pip install oasdiff 2>/dev/null || true
            echo "Checking for breaking changes in OpenAPI spec..."
            # Using Python-based diff as fallback
            python -c "
          import yaml
          with open('/tmp/prev_openapi.yaml') as f:
              prev = yaml.safe_load(f)
          with open('openapi.yaml') as f:
              curr = yaml.safe_load(f)
          prev_paths = set(prev.get('paths', {}).keys())
          curr_paths = set(curr.get('paths', {}).keys())
          removed = prev_paths - curr_paths
          if removed:
              print(f'BREAKING CHANGE: Removed paths: {removed}')
              exit(1)
          print(f'No breaking changes detected. Paths: {len(curr_paths)}')
            "
          else
            echo "No previous openapi.yaml found — skipping diff check"
          fi

      - name: Commit openapi.yaml if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi.yaml
          git diff --staged --quiet || git commit -m "chore: regenerate openapi.yaml [skip ci]"
          git push || true

  # ---------------------------------------------------------------------------
  # Number validator smoke test (must pass before any deploy)
  # ---------------------------------------------------------------------------
  validator-smoke:
    name: Guardrail Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install pydantic pydantic-settings structlog prometheus-client python-jose passlib

      - name: Run number validator smoke test
        run: python scripts/check_number_validator.py
