  /v1/twin/{pond_id}/whatif:
    post:
      tags:
      - Digital Twin
      summary: Run a what-if simulation
      description: "Applies the given scenario deltas to the current twin state and\
        \ returns the simulated outcome. risk_delta is computed by re-running the\
        \ real M2 risk-scoring model (app/ml_inference/numeric/m2_risk_engine.py)\
        \ against the pond's actual recent chemistry with the scenario's deltas applied\
        \ \u2014 not a hardcoded estimate. delta_feed_rate_pct currently has no effect:\
        \ no feed-log ingestion pipeline exists to translate a feed-rate change into\
        \ a chemistry or risk effect."
      operationId: whatif_v1_twin__pond_id__whatif_post
      parameters:
      - name: pond_id
