name: SDK Generation

on:
  push:
    branches: ["main"]
    paths:
      - "openapi.yaml"

jobs:
  sdk-gen:
    name: Regenerate Client SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install openapi-generator-cli
        run: |
          npm install -g @openapitools/openapi-generator-cli

      - name: Generate TypeScript SDK
        run: |
          mkdir -p sdk/typescript
          openapi-generator-cli generate \
            -i openapi.yaml \
            -g typescript-axios \
            -o sdk/typescript \
            --additional-properties=npmName=@aquaverse/api-client,npmVersion=0.1.0

      - name: Generate Python SDK
        run: |
          mkdir -p sdk/python
          openapi-generator-cli generate \
            -i openapi.yaml \
            -g python \
            -o sdk/python \
            --additional-properties=packageName=aquaverse_client,packageVersion=0.1.0

      - name: Commit regenerated SDKs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sdk/
          git diff --staged --quiet || git commit -m "chore: regenerate client SDKs from openapi.yaml [skip ci]"
          git push || true
